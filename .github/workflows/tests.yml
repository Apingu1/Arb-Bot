name: tests

on:
  push:
    branches:
      - main
      - phase1/shadow-arb-engine
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: pytest -q
